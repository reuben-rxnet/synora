name: synora

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: synora
      POSTGRES_PASSWORD: synora-local-dev
      POSTGRES_DB: synora
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synora -d synora"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
