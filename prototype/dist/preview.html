<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body><title>Synora</title>
<meta name="description" content="Synora – Enterprise intelligence, connected. Interactive prototype with demonstration data.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>/* Layout: navy sidebar + calm neutral workspace; conversation-first search column, multi-column evidence on wide screens. */
:root {
  --bg: #f5f6fb; --surface: #ffffff; --surface-2: #eef0f7; --surface-3: #e6e9f3; --line: #dfe3ee; --line-strong: #c9cfe0;
  --fg: #111633; --fg-2: #2d3454; --muted: #5b6283;
  --accent: #4338ca; --accent-hover: #3730a3; --accent-soft: #eceafe; --accent-fg: #ffffff; --accent-2: #0e7490;
  --brand-a: #4f46e5; --brand-b: #0891b2;
  --nav-bg: #0e1330; --nav-fg: #c9cdea; --nav-muted: #8a90b8; --nav-active: #1d2552; --nav-line: #1f2650;
  --good: #15803d; --warn: #b45309; --bad: #b91c1c; --info: #1d4ed8; --violet: #6d28d9; --ai: #4338ca;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --shadow-sm: 0 1px 2px rgba(17, 22, 51, .06); --shadow: 0 1px 3px rgba(17, 22, 51, .06), 0 8px 24px -12px rgba(17, 22, 51, .14);
  --shadow-lg: 0 24px 60px -20px rgba(17, 22, 51, .35);
  --overlay: rgba(10, 13, 32, .45);
  --font-display: 'Sora', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r: 10px; --r-lg: 16px; --r-sm: 7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0d1a; --surface: #121629; --surface-2: #181d34; --surface-3: #20263f; --line: #262c48; --line-strong: #353d60;
    --fg: #e9ebf7; --fg-2: #c6cae2; --muted: #9aa0c2;
    --accent: #8f91ff; --accent-hover: #a5a7ff; --accent-soft: #23255a; --accent-fg: #0b0d1f; --accent-2: #22d3ee;
    --brand-a: #6366f1; --brand-b: #06b6d4;
    --nav-bg: #070a17; --nav-fg: #c9cdea; --nav-muted: #7d84ad; --nav-active: #171d44; --nav-line: #161b38;
    --good: #4ade80; --warn: #fbbf24; --bad: #f87171; --info: #60a5fa; --violet: #b39dfb; --ai: #a5a7ff;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 8px 24px -12px rgba(0, 0, 0, .6);
    --shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, .8); --overlay: rgba(2, 3, 10, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0d1a; --surface: #121629; --surface-2: #181d34; --surface-3: #20263f; --line: #262c48; --line-strong: #353d60;
  --fg: #e9ebf7; --fg-2: #c6cae2; --muted: #9aa0c2;
  --accent: #8f91ff; --accent-hover: #a5a7ff; --accent-soft: #23255a; --accent-fg: #0b0d1f; --accent-2: #22d3ee;
  --brand-a: #6366f1; --brand-b: #06b6d4;
  --nav-bg: #070a17; --nav-fg: #c9cdea; --nav-muted: #7d84ad; --nav-active: #171d44; --nav-line: #161b38;
  --good: #4ade80; --warn: #fbbf24; --bad: #f87171; --info: #60a5fa; --violet: #b39dfb; --ai: #a5a7ff;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 8px 24px -12px rgba(0, 0, 0, .6);
  --shadow-lg: 0 24px 60px -20px rgba(0, 0, 0, .8); --overlay: rgba(2, 3, 10, .65);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
:root[data-density="compact"] body { font-size: 13.5px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; color: var(--fg); }
h1 { font-size: 1.6rem; font-weight: 600; }
.h2 { font-size: 1.2rem; font-weight: 600; }
.h3, h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--font-mono); font-size: .88em; }
kbd { font-family: var(--font-mono); font-size: .75rem; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); background: var(--surface); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.grow { flex: 1 1 auto; min-width: 0; }
.min0 { min-width: 0; }
.right { text-align: right; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 8px; top: -40px; background: var(--accent); color: var(--accent-fg); padding: 8px 12px; border-radius: 8px; z-index: 100; }
.skip:focus { top: 8px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.rel { position: relative; }
.eyebrow { display: block; font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.label { display: block; font-size: .82rem; font-weight: 600; color: var(--fg-2); margin: 10px 0 5px; }
.hint { font-size: .8rem; color: var(--muted); margin-top: 4px; display: flex; gap: 5px; align-items: center; }
.row { display: flex; gap: 10px; align-items: center; }
.row.tight, .row-wrap.tight { gap: 6px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row-between { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.row-end { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; align-items: center; margin-top: 8px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
.span-2 { grid-column: span 2; }
.w-auto { width: auto; }
@media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } .span-2 { grid-column: auto; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg); padding: 8px 14px; border-radius: var(--r-sm); cursor: pointer; font-weight: 500; font-size: .9rem; line-height: 1.2; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-sm { padding: 6px 10px; font-size: .83rem; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
:root[data-theme="dark"] .btn-danger { color: #1a0505; }
.btn-danger-ghost { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); background: transparent; }
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--fg-2); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.icon-btn.pressed { background: var(--accent-soft); color: var(--accent); }
.dot-badge { position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--bad); color: #fff; font-size: .65rem; font-weight: 700; display: grid; place-items: center; padding: 0 4px; border: 2px solid var(--surface); }
.link-btn { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 2px 0; font-weight: 500; font-size: .88rem; text-align: left; }
.link-btn:hover { text-decoration: underline; }
.back { margin-bottom: 8px; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: .74rem; font-weight: 600; white-space: nowrap; border: 1px solid transparent; line-height: 1.5; }
.b-neutral { background: var(--surface-2); color: var(--fg-2); border-color: var(--line); }
.b-muted { background: transparent; color: var(--muted); border-color: var(--line); }
.b-good { background: color-mix(in srgb, var(--good) 12%, transparent); color: var(--good); }
.b-warn { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
.b-bad { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
.b-info { background: color-mix(in srgb, var(--info) 12%, transparent); color: var(--info); }
.b-violet { background: color-mix(in srgb, var(--violet) 12%, transparent); color: var(--violet); }
.b-ai { background: linear-gradient(90deg, color-mix(in srgb, var(--brand-a) 14%, transparent), color-mix(in srgb, var(--brand-b) 14%, transparent)); color: var(--ai); }
.demo-tag { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; color: var(--muted); border: 1px dashed var(--line-strong); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.count-pill { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); font-size: .7rem; font-weight: 700; margin-left: 4px; }

/* Inputs */
.input { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-sm); padding: 8px 10px; color: var(--fg); min-width: 0; }
.input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 0; border-color: var(--accent); }
.input:disabled { background: var(--surface-2); color: var(--muted); }
.input-sm { padding: 5px 8px; font-size: .85rem; }
.input-xs { padding: 2px 6px; font-size: .78rem; width: 90px; }
textarea.input { resize: vertical; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.check, .radio { display: flex; align-items: center; gap: 9px; padding: 5px 0; cursor: pointer; }
.radio-group { border: 0; padding: 0; margin: 0 0 10px; }
fieldset { border: 0; padding: 0; margin: 0; }
.toggle-row { display: flex; gap: 14px; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
.toggle-row:last-child { border-bottom: 0; }
.toggle-text label { font-weight: 500; }
.switch { width: 40px; height: 23px; border-radius: 12px; background: var(--line-strong); border: 0; position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch .knob { position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform .15s; }
.switch.on { background: var(--accent); }
.switch.on .knob { transform: translateX(17px); }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-row.tight { gap: 4px; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg-2); padding: 4px 11px; border-radius: 999px; cursor: pointer; font-size: .83rem; }
.chip:hover { border-color: var(--accent); }
.chip-on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.fchip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent); padding: 3px 4px 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 500; }
.fchip button { display: grid; place-items: center; border: 0; background: transparent; color: inherit; cursor: pointer; border-radius: 50%; width: 20px; height: 20px; }
.fchip button:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.fchip.sm { font-size: .74rem; padding: 1px 2px 1px 8px; }
.add-tag { display: inline-flex; align-items: center; gap: 4px; border: 1px dashed var(--line-strong); background: none; border-radius: 999px; padding: 1px 8px; font-size: .74rem; color: var(--muted); cursor: pointer; }
.search-mini { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 0 10px; background: var(--surface); color: var(--muted); min-width: 0; }
.search-mini input { border: 0; background: transparent; padding: 7px 0; outline: none; min-width: 0; width: 180px; color: var(--fg); }
.search-mini:focus-within { border-color: var(--accent); }
.inline-sel { display: inline-flex; gap: 6px; align-items: center; }
.inline-sel .input { width: auto; }

/* Shell */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); height: 100%; transition: grid-template-columns .2s; }
.shell.collapsed { grid-template-columns: 70px minmax(0, 1fr); }
.sidebar { background: var(--nav-bg); color: var(--nav-fg); display: flex; flex-direction: column; padding: 14px 10px; gap: 6px; overflow-y: auto; overflow-x: hidden; }
.side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; border-bottom: 1px solid var(--nav-line); margin-bottom: 8px; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-text b { font-family: var(--font-display); font-size: 1.15rem; color: #fff; letter-spacing: -.01em; }
.brand-text span { font-size: .7rem; color: var(--nav-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 12px; border-radius: 9px; border: 0; background: transparent; color: var(--nav-fg); cursor: pointer; text-align: left; font-weight: 500; white-space: nowrap; }
.nav-item:hover { background: var(--nav-active); color: #fff; }
.nav-item.active { background: var(--nav-active); color: #fff; box-shadow: inset 0 0 0 1px #2c3570; }
.nav-item.active .ico { color: #8fd9ec; }
.nav-item:focus-visible { outline-color: #8fd9ec; }
.nav-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--nav-line); padding-top: 10px; }
.nav-user .nav-label { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.nav-user .nav-label b { color: #fff; font-size: .88rem; }
.nav-user .muted { color: var(--nav-muted); }
.collapsed .nav-label, .collapsed .brand-text { display: none; }
.collapsed .nav-item { justify-content: center; padding: 10px 0; }
.collapsed .side-brand { justify-content: center; padding-inline: 0; }
.avatar { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--brand-a), var(--brand-b)); color: #fff; font-weight: 700; font-size: .78rem; flex: none; }
.avatar.sm { width: 28px; height: 28px; font-size: .7rem; }
.avatar.lg { width: 56px; height: 56px; font-size: 1.1rem; }
.avatar-btn { border: 0; background: none; padding: 2px; cursor: pointer; border-radius: 50%; }
.main-col { display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); flex: none; }
.top-title { flex: 1; min-width: 0; }
.tagline { font-family: var(--font-display); font-size: .86rem; color: var(--muted); }
.brand-top { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); flex: 1; }
.kbd-search { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--muted); border-radius: 9px; padding: 6px 8px 6px 11px; cursor: pointer; min-width: 220px; }
.kbd-search span { flex: 1; text-align: left; font-size: .86rem; }
.top-actions { display: flex; align-items: center; gap: 4px; }
.health-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; border-radius: 9px; cursor: pointer; font-size: .82rem; color: var(--fg-2); }
.health-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--muted); }
.hd-good { background: var(--good); } .hd-warn { background: var(--warn); } .hd-bad { background: var(--bad); } .hd-info { background: var(--info); } .hd-muted { background: var(--line-strong); }
.main { flex: 1; overflow-y: auto; overflow-x: hidden; outline: none; position: relative; }
.scenario-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 7px 20px; background: color-mix(in srgb, var(--warn) 12%, var(--surface)); color: var(--fg); font-size: .84rem; border-bottom: 1px solid var(--line); }
.only-mobile { display: none !important; }
.bottom-nav { display: none; }
.nav-scrim { display: none; }

@media (max-width: 1024px) {
  .shell, .shell.collapsed { grid-template-columns: 70px minmax(0, 1fr); }
  .shell .nav-label, .shell .brand-text { display: none; }
  .shell .nav-item { justify-content: center; padding: 10px 0; }
  .shell .side-brand { justify-content: center; padding-inline: 0; }
  .collapse-btn { display: none !important; }
  .kbd-search { min-width: 0; }
}
@media (max-width: 720px) {
  .shell, .shell.collapsed { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: min(290px, 86vw); z-index: 60; transform: translateX(-100%); transition: transform .2s; padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-left: max(10px, env(safe-area-inset-left, 0px)); }
  .sidebar.open { transform: none; }
  .sidebar .nav-label, .sidebar .brand-text { display: flex; }
  .sidebar .nav-item { justify-content: flex-start; padding: 11px 12px; }
  .sidebar .side-brand { justify-content: flex-start; padding-inline: 8px; }
  .nav-scrim { display: block; position: fixed; inset: 0; background: var(--overlay); z-index: 55; }
  .only-mobile { display: inline-flex !important; }
  .hide-mobile { display: none !important; }
  .topbar { gap: 6px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
  .kbd-search { padding: 8px; border-radius: 9px; }
  .main-col { padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px)); }
  .bottom-nav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .bottom-nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; border: 0; background: none; color: var(--muted); font-size: .68rem; cursor: pointer; }
  .bottom-nav button.active { color: var(--accent); font-weight: 600; }
}

/* Popovers & menus */
.popover { position: absolute; top: calc(100% + 6px); z-index: 45; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 12px; width: 320px; max-width: calc(100vw - 24px); }
.pop-right { right: 0; } .pop-left { left: 0; }
.pop-title { font-size: .9rem; margin-bottom: 6px; }
.pop-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.menu { width: 220px; padding: 6px; }
.menu-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 7px; cursor: pointer; text-align: left; font-size: .88rem; }
.menu-item:hover, .menu-item:focus-visible { background: var(--surface-2); }
.menu-item.danger { color: var(--bad); }
.hist-list, .notif-list, .check-list, .mini-list, .gap-list, .health-list, .activity, .rec-list, .saved-list, .tour, .hypo-list, .why-list, .cmp-val { list-style: none; margin: 0; padding: 0; }
.hist-list button, .notif-list button { display: flex; gap: 9px; align-items: center; width: 100%; padding: 8px; border: 0; background: none; border-radius: 8px; text-align: left; cursor: pointer; font-size: .86rem; }
.hist-list button span:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist-list button:hover, .notif-list button:hover { background: var(--surface-2); }
.notif-pop { width: 360px; }
.notif-list button { align-items: flex-start; }
.notif-list .grow { display: flex; flex-direction: column; }
.notif-list .unread b { color: var(--fg); }
.unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex: none; }
.src-pop { width: 300px; }

/* Overlays */
.overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 70; display: grid; place-items: center; padding: 16px; animation: fade .15s ease-out; }
.modal { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); width: 100%; max-height: min(88vh, 900px); display: flex; flex-direction: column; border: 1px solid var(--line); }
.modal-sm { max-width: 440px; } .modal-md { max-width: 580px; } .modal-lg { max-width: 760px; } .modal-xl { max-width: 980px; }
.modal-head, .drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px 12px; }
.modal-head h2, .drawer-head h2 { font-size: 1.12rem; }
.modal-body { padding: 4px 20px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.modal-foot, .drawer-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 20px; border-top: 1px solid var(--line); }
.overlay-drawer { place-items: stretch end; padding: 0; }
.drawer { background: var(--surface); width: min(460px, 100vw); height: 100%; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: slide .2s ease-out; padding-top: env(safe-area-inset-top, 0px); }
.drawer-wide { width: min(760px, 100vw); }
.drawer-body { flex: 1; overflow-y: auto; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.sheet-grip { display: none; }
@media (max-width: 720px) {
  .overlay-drawer { place-items: end stretch; }
  .drawer { width: 100%; height: auto; max-height: 88vh; border-radius: 18px 18px 0 0; animation: rise .2s ease-out; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .sheet-grip { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 8px auto 0; }
  .overlay { padding: 8px; }
  .modal { max-height: 94vh; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateX(24px); opacity: .6; } }
@keyframes rise { from { transform: translateY(30px); opacity: .6; } }
.toasts { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 90; width: max-content; max-width: calc(100vw - 32px); }
.toast { display: flex; gap: 9px; align-items: center; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: .88rem; animation: rise .2s ease-out; }
.toast.t-good .ico { color: color-mix(in srgb, var(--good) 60%, var(--bg)); }
@media (max-width: 720px) { .toasts { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); } }

/* Callouts */
.callout { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: var(--r); border: 1px solid; font-size: .9rem; }
.callout > .ico { margin-top: 2px; flex: none; }
.callout-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.callout-body strong { font-weight: 600; }
.c-info { background: color-mix(in srgb, var(--info) 7%, var(--surface)); border-color: color-mix(in srgb, var(--info) 25%, transparent); }
.c-info > .ico { color: var(--info); }
.c-warn { background: color-mix(in srgb, var(--warn) 8%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.c-warn > .ico { color: var(--warn); }
.c-bad { background: color-mix(in srgb, var(--bad) 7%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.c-bad > .ico { color: var(--bad); }
.c-good { background: color-mix(in srgb, var(--good) 8%, var(--surface)); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.c-good > .ico { color: var(--good); }

/* Pages */
.page { max-width: 1240px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; }
.page-head p { margin-top: 4px; max-width: 64ch; }
@media (max-width: 720px) { .page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 16px; } h1 { font-size: 1.35rem; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow-sm); }
.panel.narrow { max-width: 680px; }
.panel-inner { background: var(--surface-2); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 40px 16px; }
.empty-ico { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.empty p { max-width: 46ch; }

/* Search landing */
.page-search { min-height: 100%; }
.search-landing { max-width: 860px; margin: 0 auto; padding-block: 6vh 40px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 26px; }
.landing-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.landing-hero h1 { font-size: clamp(1.7rem, 3.4vw, 2.3rem); font-weight: 600; letter-spacing: -.025em; }
.landing-section { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.prompt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.prompt-card { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 11px 13px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); cursor: pointer; color: var(--fg-2); font-size: .89rem; transition: border-color .15s, background .15s; }
.prompt-card .ico { color: var(--accent); margin-top: 2px; flex: none; }
.prompt-card:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.landing-cols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; }
.recent-list, .avail-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.recent-item { display: flex; gap: 10px; align-items: center; width: 100%; padding: 8px 10px; border: 0; background: none; text-align: left; border-radius: 9px; cursor: pointer; }
.recent-item:hover { background: var(--surface); box-shadow: var(--shadow-sm); }
.recent-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.recent-text b { font-weight: 500; font-size: .89rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avail-list li { display: flex; gap: 9px; align-items: center; padding: 4px 2px; font-size: .86rem; }
.avail-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.landing-foot { display: flex; justify-content: center; }
@media (max-width: 720px) { .prompt-grid, .landing-cols { grid-template-columns: 1fr; } .search-landing { padding-top: 20px; } }

.src-ico { display: inline-grid; place-items: center; border-radius: 9px; flex: none; }
.src-ico.t1 { background: color-mix(in srgb, var(--s1) 14%, transparent); color: var(--s1); }
.src-ico.t2 { background: color-mix(in srgb, var(--violet) 14%, transparent); color: var(--violet); }
.src-ico.t3 { background: color-mix(in srgb, var(--accent-2) 14%, transparent); color: var(--accent-2); }
.src-ico.t4 { background: color-mix(in srgb, var(--s2) 14%, transparent); color: var(--s2); }
.src-ico.t5 { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }

/* Search box */
.searchbox-wrap { display: flex; flex-direction: column; gap: 10px; }
.mode-row { display: flex; flex-wrap: wrap; gap: 6px; }
.mode-pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: .84rem; color: var(--fg-2); }
.mode-pill:hover { border-color: var(--line-strong); }
.mode-pill.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.searchbox { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 12px 8px 16px; transition: border-color .15s, box-shadow .15s; }
.searchbox:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent), var(--shadow); }
.searchbox textarea { width: 100%; border: 0; outline: none; resize: none; background: transparent; font-size: 1.02rem; line-height: 1.5; padding: 2px 0; min-height: 30px; color: var(--fg); }
.searchbox textarea::placeholder { color: var(--muted); }
.searchbox-tools { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 6px; }
.tools-left, .tools-right { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.tool-btn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid transparent; background: none; padding: 6px 9px; border-radius: 9px; cursor: pointer; font-size: .84rem; color: var(--fg-2); white-space: nowrap; }
.tool-btn:hover { background: var(--surface-2); }
.send-btn { width: 38px; height: 38px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; cursor: pointer; }
.send-btn:disabled { background: var(--surface-3); color: var(--muted); cursor: not-allowed; }
.attach-row { margin-top: 6px; }
.attach-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 2px 4px 2px 8px; font-size: .78rem; }
.attach-chip button { border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.attach-sample { display: flex; gap: 10px; align-items: center; border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 10px 12px; }
.filter-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.check-list li .check { font-size: .88rem; }
@media (max-width: 720px) { .tool-btn { padding: 6px; font-size: .8rem; } .mode-pill { font-size: .78rem; padding: 4px 10px; } }

/* Thread */
.search-thread { min-height: 100%; display: flex; flex-direction: column; }
.thread-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 1180px; width: 100%; margin: 0 auto; padding-block: 14px 0; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.thread { flex: 1; max-width: 1180px; width: 100%; margin: 0 auto; padding-block: 8px 24px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 30px; }
.turn { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 12px; }
.q-bubble { align-self: flex-end; max-width: min(720px, 92%); background: var(--surface-3); border-radius: 16px 16px 4px 16px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.q-bubble p { font-size: 1rem; white-space: pre-wrap; }
.dock { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 70%, transparent); padding-block: 14px 16px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.dock .searchbox-wrap { max-width: 860px; margin: 0 auto; }
.searchbox-wrap.compact .searchbox textarea { font-size: .96rem; }
@media (max-width: 720px) { .thread, .thread-bar, .dock { padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); } .dock .mode-row { flex-wrap: nowrap; overflow-x: auto; } }

/* Answer */
.answer { display: flex; flex-direction: column; gap: 14px; }
.answer-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.ai-mark { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, var(--brand-a), var(--brand-b)); color: #fff; }
.muted-mark { background: var(--surface-3); color: var(--muted); }
.retrieve { list-style: none; margin: 0; padding: 4px 0; display: flex; flex-direction: column; gap: 8px; font-size: .9rem; color: var(--muted); }
.retrieve li { display: flex; align-items: center; gap: 10px; }
.retrieve li.done { color: var(--fg-2); }
.retrieve li.now { color: var(--fg); font-weight: 500; }
.r-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-strong); display: grid; place-items: center; flex: none; }
.retrieve .done .r-dot { background: var(--good); border-color: var(--good); color: #fff; }
.retrieve .now .r-dot { border-color: var(--accent); border-top-color: transparent; animation: spin 1s linear 6; }
@keyframes spin { to { transform: rotate(360deg); } }
.trust { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.trust li { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; color: var(--fg-2); background: var(--surface); border: 1px solid var(--line); padding: 3px 9px; border-radius: 999px; }
.trust li .ico { color: var(--good); }
.trust li.t-warn .ico { color: var(--warn); }
.trust li.t-good .ico { color: var(--good); }
.answer-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
.answer-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ans-sec { display: flex; flex-direction: column; gap: 8px; }
.ans-sec h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .98rem; }
.summary { font-size: 1.03rem; line-height: 1.65; color: var(--fg); max-width: 70ch; }
.caret { display: inline-block; width: 8px; height: 1.05em; background: var(--accent); vertical-align: text-bottom; margin-left: 2px; border-radius: 2px; }
.cites { display: inline-flex; flex-wrap: wrap; gap: 3px; margin-left: 4px; vertical-align: 1px; }
.cite { font-family: var(--font-mono); font-size: .7rem; font-weight: 500; border: 1px solid; background: var(--surface); border-radius: 5px; padding: 0 5px; cursor: pointer; line-height: 1.55; }
.cite:hover { background: var(--surface-2); }
.cite.k-historical { color: var(--info); border-color: color-mix(in srgb, var(--info) 40%, transparent); }
.cite.k-approved { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.cite.k-devwork { color: var(--violet); border-color: color-mix(in srgb, var(--violet) 40%, transparent); }
.cite.k-email { color: var(--fg-2); border-color: var(--line-strong); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 2px; }
.steps li { counter-increment: s; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; padding: 8px 10px 8px 40px; position: relative; border-radius: 9px; }
.steps li:hover { background: var(--surface); }
.steps li::before { content: counter(s); position: absolute; left: 8px; top: 8px; width: 22px; height: 22px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: .76rem; display: grid; place-items: center; }
.steps li > span:first-child { flex: 1 1 280px; }
.steps b { font-weight: 600; }
.step-check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; flex: 1 1 280px; }
.step-check input { margin-top: 3px; }
.hypo-list { display: flex; flex-direction: column; gap: 6px; }
.hypo-list li { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 9px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
.hypo-list li > div { display: flex; flex-direction: column; }
.answer-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.side-head { display: flex; justify-content: space-between; align-items: baseline; }
.side-head h3 { font-size: .92rem; }
.ev-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-sm); }
.ev-top { display: flex; align-items: center; gap: 9px; }
.ev-meta { flex: 1; display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.ev-title { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; cursor: pointer; color: var(--fg); font-size: .92rem; }
.ev-title:hover { color: var(--accent); text-decoration: underline; }
.ev-dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-size: .82rem; }
.ev-dl dt { color: var(--muted); }
.ev-dl dd { margin: 0; color: var(--fg-2); }
.ev-foot { display: flex; flex-wrap: wrap; gap: 5px; }
.ev-note { display: flex; gap: 5px; font-size: .78rem; color: var(--muted); align-items: flex-start; }
.ev-note .ico { margin-top: 2px; flex: none; }
.ev-actions { display: flex; justify-content: flex-start; margin: -2px -6px -4px; }
.sim { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.sim b { font-size: .84rem; font-variant-numeric: tabular-nums; }
.sim-hi { color: var(--good); } .sim-mid { color: var(--info); } .sim-lo { color: var(--muted); }
.confidence { display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.conf-gauge { display: flex; gap: 3px; flex: none; }
.conf-gauge .seg { width: 18px; height: 8px; border-radius: 3px; background: var(--line); }
.c-warn .conf-gauge .seg.on { background: var(--warn); } .c-good .conf-gauge .seg.on { background: var(--good); } .c-bad .conf-gauge .seg.on { background: var(--bad); }
.confidence p { color: var(--fg-2); font-size: .9rem; }
.answer-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding-top: 4px; border-top: 1px solid var(--line); padding-top: 10px; }
.act-sep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; }
.fb-box { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.rec-list { display: flex; flex-direction: column; }
.rec-row { display: flex; gap: 10px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.rec-row:last-child { border-bottom: 0; }
.rec-main { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; border: 0; background: none; text-align: left; padding: 0; cursor: pointer; gap: 1px; }
.rec-title { font-weight: 500; }
.rec-main:hover .rec-title { color: var(--accent); text-decoration: underline; }
.rec-badges { display: flex; gap: 5px; flex-wrap: wrap; }
.summary-pre { white-space: pre-wrap; font-family: var(--font-body); background: var(--surface-2); padding: 12px 14px; border-radius: var(--r); margin: 4px 0 10px; font-size: .9rem; line-height: 1.6; }
.mini-list { display: flex; flex-direction: column; gap: 4px; font-size: .86rem; }
.mini-list li { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.sim-inline { display: flex; flex-direction: column; gap: 6px; }
.sim-row { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; flex-wrap: wrap; }
@media (max-width: 1080px) { .answer-grid { grid-template-columns: 1fr; } }

/* Drawer contents */
.rd-head { display: flex; gap: 12px; align-items: flex-start; }
.rd-title { font-size: 1.02rem; }
.excerpt blockquote { margin: 0; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 9px 9px 0; font-size: .92rem; color: var(--fg); }
.rd-dl { display: grid; grid-template-columns: 150px 1fr; gap: 7px 12px; margin: 0; font-size: .88rem; }
.rd-dl dt { color: var(--muted); }
.rd-dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.profile-head { display: flex; gap: 14px; align-items: center; }
.profile-head h3 { font-size: 1.1rem; }
.tour { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.tour li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: var(--surface-2); border-radius: 9px; }

/* Palette */
.palette { width: min(620px, 100%); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--line); align-self: start; margin-top: 10vh; overflow: hidden; }
.pal-input { display: flex; gap: 10px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
.pal-input input { flex: 1; border: 0; outline: none; background: transparent; font-size: 1rem; color: var(--fg); min-width: 0; }
.pal-list { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow-y: auto; }
.pal-list button { display: flex; gap: 10px; align-items: center; width: 100%; padding: 9px 10px; border: 0; background: none; border-radius: 8px; text-align: left; cursor: pointer; font-size: .9rem; }
.pal-list button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-list button.active { background: var(--accent-soft); color: var(--accent); }
.pal-empty { padding: 12px; }

/* Similar */
.similar-layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 22px; align-items: start; }
.sim-form { position: sticky; top: 0; }
